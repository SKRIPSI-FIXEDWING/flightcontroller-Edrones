; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 1152000
; USB_DUAL_SERIAL exposes a second USB CDC port (SerialUSB1) alongside the
; primary Serial. Primary Serial stays dedicated to the binary MAVLink GCS
; link (fc::Mavlink); SerialUSB1 is used exclusively for plain-text CSV data
; logging (fc::DataLogger) so the two never share a wire. See
; docs/data-logger-usb.md. This platform-teensy version only recognizes the
; USB mode via a CPPDEFINE (checked directly in
; builder/frameworks/arduino.py), not the newer board_build.usb_type ini key.
build_flags = -D USB_DUAL_SERIAL
lib_deps =
	bolderflight/Bolder Flight Systems SBUS@^8.1.4
	zerokol/eFLL@^1.4.1
	duracopter/MAVLink v2 C library@^2.0
	; Not published to the PlatformIO registry under this name; PlatformIO
	; supports git-URL lib_deps, so it's fetched/pinned here instead of
	; being hand-vendored (unlike lib/third_party/libcanard, which isn't
	; an Arduino/PlatformIO-packaged library at all).
	https://github.com/tonton81/FlexCAN_T4.git#b928bcb2f74fdf0ccb76660f52ca1a2819ff4e2c
